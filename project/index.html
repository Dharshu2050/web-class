<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Registration Form</title>
    <link rel="stylesheet" href="/project/style.css">
</head>
<body>
    <h1>Workshop Registration Form</h1>

    <form action="">
        <label for="name">1.Full Name</label>
        <input type="text" placeholder="First Name" required>
        <input type="text" placeholder="Last Name" required>

        <label for="e-mail">2.Email Address</label>
        <input type="e-mail" name="" id="" placeholder="Email Address" required>

        <label for="phonenumber">3.Phonenumber</label>
        <input type="text" placeholder="Phonenumber" required>

        <label for="text">4.Address</label>
        <input type="text" placeholder="Address" >
        <input type="text" placeholder="city">
        <div class="states">
        <label for="State">
        <select name="State" id="State">
            <option value="">Select a country</option>
        </select>
       </label>
        </div>
    </form>
    <script src="/project/style.css"></script>
</body>
</html>
