<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>
<body>
    <h1>Button Click example</h1>
    <p id="click">click the button to change the text</p>
    <button onclick="changeText()">click me</button>
    <script>
        //button click pana aprm text change 
        function changeText(){
            document.getElementById("click").innerHTML="Button Clicked";
        }
    </script>
    
</body>
</html>
