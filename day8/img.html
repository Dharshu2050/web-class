<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img</title>
</head>
<body>
    <h1>Img Slider</h1>
    <img id="img" src="./img/img1.jpg" alt="img">

    <button onclick="nextImg()">next</button>
    

    <script>
        //arrays using img slider
        var image=["img1.jpeg","images2.jpeg","img3.jpeg"]

        var index=0;

        function nextImg(){
            
            index++;
            if(index>=image.length){
                index=0;
            }
            //
            document.getElementById("img").src="./img/"+image[index]
        }
    </script>
</body>
</html>
